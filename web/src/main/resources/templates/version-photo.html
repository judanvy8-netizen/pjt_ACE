<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('사진별 비교')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main>
  <a th:href="@{/versions}">← 버전 비교</a>
  <nav th:replace="~{photo-navigation :: controls(${navigation})}"></nav>
  <h1 th:text="${photo.truth.filename}">사진별 비교</h1>
  <p th:text="|정답 고양이 / 개: ${photo.truth.counts.display()}|"></p>
  <p th:text="${photo.truth.breeds}"></p>
  <p th:unless="${photo.truth.note.isBlank()}" th:text="${photo.truth.note}"></p>
  <div class="comparison-grid" th:data-filename="${photo.truth.filename}">
    <figure><figcaption>원본</figcaption>
      <a th:if="${photo.image}" data-preview="원본" th:href="@{/versions/images/original/{name}(name=${photo.truth.filename})}">
      <img th:src="@{/versions/images/original/{name}(name=${photo.truth.filename})}" alt="기준 원본 사진">
      <span class="zoom-hint" aria-hidden="true">⌕ 확대</span>
      </a>
      <p th:unless="${photo.image}">원본 자료 없음</p>
    </figure>
    <figure th:each="item : ${photo.results}">
      <figcaption th:text="${item.version.id}"></figcaption>
      <a th:if="${item.image}" th:data-preview="${item.version.id}" th:href="@{/versions/images/{version}/{name}(version=${item.version.id},name=${photo.truth.filename})}">
      <img th:src="@{/versions/images/{version}/{name}(version=${item.version.id},name=${photo.truth.filename})}" alt="검출 박스를 표시한 결과 사진">
      <span class="zoom-hint" aria-hidden="true">⌕ 확대</span>
      </a>
      <p th:unless="${item.image}">결과 이미지 없음</p>
      <p th:text="${item.counts == null ? item.status : '고양이 / 개 ' + item.counts.display() + ' · ' + item.status}"></p>
      <p th:if="${item.counts != null}" th:text="|정답 ${photo.truth.counts.display()} → 예측 ${item.counts.display()} · Δ ${item.counts.cats - photo.truth.counts.cats}/${item.counts.dogs - photo.truth.counts.dogs}|"></p>
      <p th:text="${item.version.id == 'main' ? '품종: 해당 없음' : (item.verdict == null ? '품종: 확인 필요' : '품종: ' + item.verdict.breedLabel())}"></p>
    </figure>
  </div>
  <section th:each="item : ${photo.results}">
    <h2 th:text="|${item.version.id} 품종 후보|"></h2>
    <p th:if="${item.version.id == 'main'}">이 버전은 종류별 마릿수를 집계합니다.</p>
    <p th:if="${item.version.id != 'main' and item.classes.isEmpty()}">분류 결과 행이 없습니다.</p>
    <p th:if="${item.classificationWarning}" class="notice">확인 필요 · 분류 CSV 누락, 중복 또는 형식 오류</p>
    <div class="table-wrap" th:unless="${item.classes.isEmpty()}"><table>
      <thead><tr><th>박스 번호</th><th>검출 종류</th><th>검출 점수</th><th>품종 후보와 점수</th><th>분류 상태</th></tr></thead>
      <tbody><tr th:each="row : ${item.classes}">
        <td th:text="${row['object_no']}"></td><td th:text="${row['detected_species']}"></td>
        <td th:text="${row['det_confidence']}"></td>
        <td><th:block th:replace="~{breed-display :: candidate(${row['class_label']}, ${item.breedConfidence(row)})}"></th:block></td>
        <td th:text="${row['species_match']}"></td>
      </tr></tbody>
    </table></div>
  </section>
  <div th:replace="~{layout :: preview}"></div>
</main>
<script th:src="@{/photo-navigation.js}" defer></script>
<script th:src="@{/image-preview.js}" defer></script>
</body>
</html>
