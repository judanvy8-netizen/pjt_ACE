<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('성능 검증')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main class="wide-main">
  <h1>성능 검증</h1>
  <p><span th:text="${standardBaseline ? '표준 입력 기준선' : '보관 제출본'}"></span>
     <span th:text="| · 기준 사진 ${performance.photos.size()}장 · 고양이와 개 마릿수가 모두 맞으면 일치|"></span></p>
  <p th:if="${performance.photos.isEmpty()}" class="notice">기준 정답 자료를 읽을 수 없습니다.</p>
  <div th:unless="${performance.photos.isEmpty()}">
    <div class="metric-grid version-metrics">
      <article class="panel" th:each="rate : ${performance.versions}">
        <h2 th:text="${rate.version}"></h2>
        <strong th:text="${rate.missing == rate.total ? '미측정' : rate.correct + ' / ' + rate.total + '장 · ' + #numbers.formatDecimal(rate.percent(), 1, 1) + '%'}"></strong>
        <p class="hint" th:if="${rate.missing > 0}" th:text="|누락·확인 필요 ${rate.missing}장|"></p>
      </article>
    </div>
    <div class="dashboard-pair">
      <section class="panel">
        <h2>정답 마릿수별 일치율</h2>
        <p class="hint">고양이와 개의 정답 마릿수를 합해 묶었습니다. 누락된 결과도 기준 사진 장수에 포함됩니다.</p>
        <div class="count-group" th:each="group : ${performance.groups}">
          <h3 th:text="|${group.expectedTotal}마리 · ${group.photos}장|"></h3>
          <div class="rate-line" th:each="rate : ${group.rates}">
            <span th:text="${rate.version}"></span>
            <meter min="0" max="100" th:value="${rate.percent()}" th:class="${rate.version}"
                   th:attr="aria-label=|${rate.version} 일치율|"></meter>
            <span th:text="|${rate.correct}/${rate.total}|"></span>
          </div>
        </div>
      </section>
      <section class="panel">
        <h2>기준 사진 지도</h2>
        <p>사진 번호를 선택하면 원본과 네 버전 결과를 비교합니다.</p>
        <div class="photo-legend hint">
          <span><i class="photo-dot matched"></i> 일치</span><span><i class="photo-dot mismatched"></i> 불일치</span>
          <span><i class="photo-dot missing"></i> 자료 없음·점검</span><span>순서 main · main-1 · main-2 · main-3</span>
        </div>
        <div class="photo-map">
          <a th:each="tile : ${performance.photos}" th:href="@{/versions/photos/{filename}(filename=${tile.filename})}"
             th:title="${tile.filename}">
            <strong th:text="${#numbers.formatInteger(tile.number, 2)}"></strong>
            <span class="photo-dots">
              <span th:each="result : ${tile.statuses}" class="photo-dot" th:classappend="${result.status}"
                    th:title="|${result.version} ${result.label}|"><span class="visually-hidden" th:text="|${result.version} ${result.label}|"></span></span>
            </span>
            <span class="visually-hidden" th:text="${tile.filename}"></span>
          </a>
        </div>
      </section>
    </div>
  </div>
  <a th:href="@{/benchmark}">오답·품종 검증표</a>
</main>
</body>
</html>
