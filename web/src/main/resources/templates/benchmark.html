<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('오답·품종 검증')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main>
  <a th:href="@{/versions}">← 버전 비교</a>
  <h1>제출본 main-2 검증표</h1>
  <p>제출 시점의 수기 검증 기록입니다. 박스 번호는 main-2 결과 이미지에서 확인합니다.</p>
  <section th:each="entry : ${tables}" th:with="first=${entryStat.first}">
    <h2 th:text="${first ? '마릿수 검증' : '개체별 품종 검증'}"></h2>
    <p th:text="|${entry.rows.size()}행 · 형식 오류 ${entry.invalidRows}행|"></p>
    <p th:if="${entry.headers.isEmpty()}">자료를 읽을 수 없습니다.</p>
    <div class="table-wrap" th:unless="${entry.headers.isEmpty()}"><table>
      <thead><tr><th th:each="key : ${entry.headers}" th:text="${key}"></th></tr></thead>
      <tbody><tr th:each="row : ${entry.rows}"><td th:each="key : ${entry.headers}" th:text="${row[key]}"></td></tr></tbody>
    </table></div>
  </section>
</main>
</body>
</html>
