spring.application.name=ace-web
server.address=127.0.0.1
server.port=${ACE_WEB_PORT:8080}
spring.datasource.url=${ACE_DB_URL:jdbc:mysql://127.0.0.1:3306/ace_web?connectionTimeZone=Asia/Seoul}
spring.datasource.username=${ACE_DB_USER:ace_app}
spring.datasource.password=${ACE_DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.config.import=optional:file:./application-local.properties
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=610MB
server.tomcat.max-part-count=50
ace.storage=${ACE_STORAGE:../ACE_STORAGE}
ace.ai-url=${ACE_AI_URL:http://127.0.0.1:8090}

ace.project-root=${ACE_PROJECT_ROOT:..}

ace.baseline-dir=${ACE_BASELINE_DIR:data/baseline}
